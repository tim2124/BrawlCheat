name: Build IPA

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Archive
        run: |
          xcodebuild \
            -project BrawlCheat.xcodeproj \
            -scheme BrawlCheat \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/BrawlCheat.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p ./build/Payload
          cp -r ./build/BrawlCheat.xcarchive/Products/Applications/BrawlLoader.app \
            ./build/Payload/
          cd ./build
          zip -r BrawlCheat.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: BrawlCheat.ipa
          path: ./build/BrawlCheat.ipa
